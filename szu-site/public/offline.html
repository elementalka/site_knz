<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Офлайн режим</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0b1220;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      .card {
        max-width: 520px;
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-align: center;
      }
      a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ви офлайн</h1>
      <p>Основні сторінки кешуються, але зараз немає з’єднання. Спробуйте оновити пізніше.</p>
      <a href="/">Повернутися на головну</a>
    </div>
  </body>
</html>
